name: Publish to GitHub Releases

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://fundacionrenacer.com.sv"
    steps:
      - uses: actions/checkout@v6
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - run: tar -xf artifact.tar && rm artifact.tar && zip -r renacer.zip .

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: renacer.zip
